<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title> — Frontend Developer & Creative Engineer</title>
    <meta
      name="description"
      content="Portfolio of Your Name — building futuristic, interactive, high-performance web experiences with React and modern frontend engineering."
    />
    <meta name="author" content="Aryan Yalavarthi" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:title" content="Aryan Yalavarthi — Frontend Developer & Creative Engineer" />

      property="og:description"
      content="Building futuristic, interactive, high-performance web experiences."
    />
    <meta property="og:image" content="https://your-domain.com/profile/profile.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aryan Yalavarthi — Frontend Developer & Creative Engineer" />
    <meta
      name="twitter:description"
      content="Building futuristic, interactive, high-performance web experiences."
    />
    <meta name="twitter:image" content="https://your-domain.com/profile/profile.jpg" />

    <!-- Theme + fonts -->
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"

    />

    <script type="application/ld+json">

        "name": "Aryan Yalavarthi",
        "url": "https://your-domain.com/",
